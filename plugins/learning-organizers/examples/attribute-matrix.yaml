# Attribute (decision) matrix. Adapted from FHWA LearnersFirst, Figure 28.
type: attribute-matrix
title: Comparing intersection types
instructions: Rate each option 1–3 on each criterion (3 = best). Weighted totals pick the strongest option.
options: [Median U-turn, Thru-turn, Four-way]
criteria:
  - name: Traffic movement
    weight: 2
    values: [Left turns made as U-turns downstream, Left turns redirected through the main line, All movements at one point]
    scores: [3, 3, 1]
  - name: Signal phasing
    weight: 1
    values: [Two-phase signals, Two-phase signals, Up to four phases]
    scores: [3, 3, 1]
  - name: Vehicle conflict points
    weight: 3
    values: ["Fewer, separated", "Fewer, separated", 32 conflict points]
    scores: [3, 2, 1]
  - name: Pedestrian conflict points
    weight: 2
    values: [Two-stage crossing, Two-stage crossing, Single crossing with turning traffic]
    scores: [2, 2, 2]
scale: 1 = weakest, 3 = strongest
source: Cox (2019), via FHWA NHI LearnersFirst
