# T-chart: two facets of one topic. Adapted from FHWA LearnersFirst, Figure 27.
type: t-chart
title: Bridge construction techniques
instructions: List the characteristics of each approach. Then write one sentence on when you would choose each.
left:
  heading: Conventional bridge construction
  items:
    - Built in place, element by element
    - Long lane closures and detours
    - Weather-dependent cast-in-place work
    - Lower specialised-equipment cost
right:
  heading: Accelerated bridge construction
  items:
    - Prefabricated elements set on site
    - Closures measured in days or hours
    - Better quality control in the plant
    - Needs heavy lifting equipment and planning
rows: 6
source: Elkaissi (2019), via FHWA NHI LearnersFirst
